<!DOCTYPE html>
<html lang="id">
<head>

  <title>Portofolio Raditya</title>

  </style>
</head>
<body>
  <img src="https://i.imgur.com/2dq56Vv.png" alt="Foto Profil Raditya" class="profil">

</html>
