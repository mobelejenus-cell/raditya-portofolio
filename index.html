        header { text-align: center; padding: 40px 20px; }
        header h1 { color: #00ff88; }

        section { background: #1a1a1a; padding: 25px; margin: 20px 0; border-radius: 10px; border: 1px solid #333; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; background: #0a0a0a; color: #eee; border: 1px solid #333; border-radius: 6px; }
        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc6a; }

        /* CHAT BOX */
      .chat-box { height: 300px; overflow-y: auto; background: #0a0a0a; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
      .msg { background: #00ff88; color: #000; padding: 10px; border-radius: 8px; margin: 5px 0; width: fit-content; max-width: 70%; }

</head>

        <header>
            <h1>> ROOT_ACCESS: Raditya</h1>
        </header>

        <section id="loginSection">
            <h2>[1] Sistem Login + Register</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="register()">Register Akun Baru</button>
            <button onclick="login()">Login</button>
            <p id="loginStatus"></p>
        </section>

        <section id="chatSection" class="hidden">
            <h2>[2] Aplikasi Chat Sederhana</h2>
            <p>Login dulu baru chat nya kebuka!</p>
            <div class="chat-box" id="chatBox"></div>
            <input type="text" id="pesanChat" placeholder="Ketik pesan...">
            <button onclick="kirimPesan()">Kirim</button>
            <button onclick="logout()" style="background:#ff0044; color:white;">Logout</button>
        </section>
    </div>

<script>
    let userLogin = null;
    let chatPesan = JSON.parse(localStorage.getItem('chat')) || [];

    // CEK APA UDAH LOGIN
    if(localStorage.getItem('userLogin')) {
        userLogin = localStorage.getItem('userLogin');
        showChat();
    }
    tampilkanChat();

    // PROJECT 1: LOGIN SYSTEM
    function register() {
        let u = document.getElementById('username').value;
        let p = document.getElementById('password').value;
        if(u==='' || p==='') return alert('Isi semua!');
        localStorage.setItem('user_'+u, p);
        document.getElementById('loginStatus').innerText = 'Register berhasil! Silakan Login';
    }

    function login() {
        let u = document.getElementById('username').value;
        let p = document.getElementById('password').value;
        let passBenar = localStorage.getItem('user_'+u);
        if(p === passBenar) {
            userLogin = u;
            localStorage.setItem('userLogin', u);
            showChat();
        } else {
            document.getElementById('loginStatus').innerText = 'Username/Password salah!';
        }
    }

    function logout() {
        userLogin = null;
        localStorage.removeItem('userLogin');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('chatSection').classList.add('hidden');
    }

    function showChat() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('chatSection').classList.remove('hidden');
    }

        document.getElementById('pesanChat').value = '';
        tampilkanChat();
    }
